name: Community CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Build, test, and audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
        with:
          version: 10.26.1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level high
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env.example -f compose.yaml config --quiet

  migration-smoke:
    name: Fresh migration smoke
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nebula
          POSTGRES_USER: nebula
          POSTGRES_PASSWORD: changeme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nebula -d nebula"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5
      - name: Apply exported migrations
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: nebula
          PGDATABASE: nebula
          PGPASSWORD: changeme
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f migrations/001_initial.sql
          psql -v ON_ERROR_STOP=1 -f migrations/002_seed.sql
      - name: Verify tables and seed
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: nebula
          PGDATABASE: nebula
          PGPASSWORD: changeme
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc \
            "SELECT to_regclass('public.conversations'), to_regclass('public.messages'), to_regclass('public.image_jobs'), (SELECT name FROM installation WHERE id = 1);" \
            | grep -Fx 'conversations|messages|image_jobs|Local Community'