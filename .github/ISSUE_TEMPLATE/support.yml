name: Community support request
description: Report a reproducible Community Edition problem
title: "[Support]: "
labels: ["support"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Installation and startup
        - Database migration
        - Local chat
        - Image generation
        - Discord integration
        - Twitch or stream integration
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Community version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Docker/Node version, and installation method. Never paste an .env file.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest numbered reproduction without prompts, tokens, or private data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, user content, private addresses, and unredacted logs.
          required: true
        - label: This is not a security vulnerability.
          required: true